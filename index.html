<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Koleksi Drama</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #ffffff;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { text-align: center; color: #bb86fc; }
    .drama-card {
      background: #1e1e1e;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border-left: 4px solid #bb86fc;
    }
    .judul { font-size: 1.1em; font-weight: bold; }
    .info { font-size: 0.9em; color: #b0b0b0; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Daftar Koleksi Drama</h1>

  <div class="drama-card">
    <div class="judul">Queen of Tears</div>
    <div class="info">2024 • Romantis, Drama • Status: Selesai</div>
  </div>

  <div class="drama-card">
    <div class="judul">Moving</div>
    <div class="info">2023 • Aksi, Fantasi • Status: Sedang Ditonton</div>
  </div>
</body>
</html>
