<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koleksi Drama - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #181a20;
            --card-color: #262932;
            --primary-color: #6c5ce7;
            --primary-hover: #5a4ad1;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .info-section {
            padding: 16px;
        }

        .drama-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .btn-watch {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-watch:active {
            background-color: var(--primary-hover);
        }

        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-sec {
            background-color: var(--card-color);
            color: var(--text-main);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .synopsis {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .episode-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .episode-header span {
            font-weight: 600;
            font-size: 15px;
            color: var(--primary-color);
        }

        .episode-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .ep-btn {
            background-color: var(--card-color);
            color: var(--text-main);
            border: 1px solid transparent;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ep-btn.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        .ep-btn.vip::after {
            content: "VIP";
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
            background: #f1c40f;
            color: #000;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="videoPlayer" controls playsinline poster="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80">
            <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
            Browser Anda tidak mendukung pemutar video.
        </video>
    </div>

    <div class="info-section">
        <h1 class="drama-title">Identitas Asli Pengawal Direktur Cantik</h1>
        <div class="badge" id="currentEpBadge">Sedang Memutar: Episode 1 • 40 Episode</div>

        <button class="btn-watch" onclick="playCurrentVideo()">
            ▶ Mulai Nonton
        </button>

        <div class="secondary-actions">
            <button class="btn-sec" onclick="simpanDrama()">🔖 Simpan</button>
            <button class="btn-sec" onclick="bagikanDrama()">📤 Bagikan</button>
        </div>

        <p class="synopsis">
            Tumbuh di tempat tersembunyi, Noah keluar mencari orang tua kandungnya. Ia menyelamatkan CEO Victoria dari bisa ular dan menjadi pengawalnya dengan gaji $1.
        </p>

        <div class="episode-header">
            <span>Episode (40)</span>
        </div>

        <div class="episode-grid" id="episodeGrid"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const sampleVideos = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
        ];

        const totalEpisodes = 40;
        const freeEpisodes = 5;
        const episodeGrid = document.getElementById('episodeGrid');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        const currentEpBadge = document.getElementById('currentEpBadge');

        for (let i = 1; i <= totalEpisodes; i++) {
            const btn = document.createElement('button');
            btn.className = 'ep-btn' + (i === 1 ? ' active' : '') + (i > freeEpisodes ? ' vip' : '');
            btn.innerText = i;
            btn.onclick = () => selectEpisode(i, btn);
            episodeGrid.appendChild(btn);
        }

        function selectEpisode(epNumber, clickedBtn) {
            if (epNumber > freeEpisodes) {
                tg.showConfirm(`Episode ${epNumber} khusus member VIP. Ingin berlangganan VIP sekarang?`, function(confirmed) {
                    if (confirmed) {
                        tg.showAlert("Mengarahkan ke menu pembayaran VIP...");
                    }
                });
                return;
            }

            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');

            const videoUrl = sampleVideos[(epNumber - 1) % sampleVideos.length];
            videoSource.src = videoUrl;
            videoPlayer.load();
            videoPlayer.play();

            currentEpBadge.innerText = `Sedang Memutar: Episode ${epNumber} • ${totalEpisodes} Episode`;
        }

        function playCurrentVideo() {
            videoPlayer.play();
        }

        function simpanDrama() {
            tg.showAlert("Drama berhasil disimpan ke daftar favorit Anda!");
        }

        function bagikanDrama() {
            const shareText = encodeURIComponent("Nonton drama seru 'Identitas Asli Pengawal Direktur Cantik' langsung di Telegram!");
            tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/dramaseru_id_bot&text=${shareText}`);
        }
    </script>
</body>
</html>
