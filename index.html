<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Drama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    #searchInput {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    #searchInput:focus {
      border-color: #38bdf8;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab:hover {
      background-color: #334155;
    }

    .tab.active {
      background-color: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }

    .drama-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background-color: #334155;
    }

    .card-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 2px 8px;
      font-size: 0.7rem;
      border-radius: 4px;
      background-color: #0284c7;
      color: #fff;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .badge.vip {
      background-color: #d97706;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: auto;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      position: relative;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .modal-header img {
      width: 100px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #334155;
      flex-shrink: 0;
    }

    .modal-info h2 {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }

    #mMeta {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    #mSinopsis {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 20px;
      max-height: 160px;
      overflow-y: auto;
    }

    .watch-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      background-color: #0284c7;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .watch-btn:hover {
      background-color: #0369a1;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Daftar Drama</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Pilih judul drama untuk membaca sinopsis dan menonton</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Cari judul drama...">
      <div class="tabs">
        <button class="tab active" data-filter="all">Semua</button>
        <button class="tab" data-filter="gratis">Gratis</button>
        <button class="tab" data-filter="vip">VIP</button>
      </div>
    </div>

    <div id="dramaGrid" class="drama-grid">
      <p class="status-msg">Memuat data drama...</p>
    </div>
  </div>

  <!-- Modal Detail -->
  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <img id="mPoster" src="" alt="Poster">
        <div class="modal-info">
          <h2 id="mTitle">Judul Drama</h2>
          <p id="mMeta"></p>
        </div>
      </div>
      <p id="mSinopsis"></p>
      <a id="mLink" href="#" target="_blank" rel="noopener noreferrer" class="watch-btn">Tonton Sekarang</a>
    </div>
  </div>

  <script>
    const SHEET_ID = '1XF7TBIkEaJ3u_qfhK2IJrbqlnTcVnlFtX5YSNLcywsE';
    const SHEET_NAME = 'Sheet1';
    const BASE_URL = 'https://' + 'docs.google.com/spreadsheets/d/';
    const SHEET_URL = `${BASE_URL}${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const FALLBACK_POSTER = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='420' viewBox='0 0 300 420'%3E%3Crect fill='%231e293b' width='300' height='420'/%3E%3Ctext fill='%2394a3b8' font-family='sans-serif' font-size='18' dy='10.5' font-weight='bold' x='50%25' y='50%25' text-anchor='middle'%3ENo Poster%3C/text%3E%3C/svg%3E";

    let allDramas = [];
    let currentFilter = 'all';

    async function loadDramas() {
      const grid = document.getElementById('dramaGrid');
      try {
        const res = await fetch(SHEET_URL);
        if (!res.ok) throw new Error('Gagal mengambil data dari server');
        
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);
        const rows = data.table.rows || [];

        allDramas = rows.map(r => {
          const c = r.c || [];
          return {
            judul: c[0] ? String(c[0].v || '').trim() : '',
            poster: c[1] ? String(c[1].v || '').trim() : FALLBACK_POSTER,
            views: c[2] ? (c[2].f || c[2].v || 0) : 0,
            status: c[3] ? String(c[3].v || '').trim() : '',
            sinopsis: c[4] ? String(c[4].v || '').trim() : 'Belum ada sinopsis.',
            totalEp: c[5] ? (c[5].v || '') : '',
            link: c[6] ? String(c[6].v || '').trim() : '#'
          };
        }).filter(item => item.judul !== '' && item.judul.toLowerCase() !== 'judul');

        renderDramas();
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p class="status-msg">Gagal memuat data dari Google Sheets. Pastikan akses sheet sudah publik.</p>';
      }
    }

    function renderDramas() {
      const grid = document.getElementById('dramaGrid');
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      grid.innerHTML = '';

      const filtered = allDramas.filter(drama => {
        const matchFilter = currentFilter === 'all' || drama.status.toLowerCase() === currentFilter;
        const matchSearch = drama.judul.toLowerCase().includes(keyword);
        return matchFilter && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="status-msg">Drama tidak ditemukan.</p>';
        return;
      }

      filtered.forEach(drama => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(drama);

        const isVip = drama.status.toLowerCase() === 'vip';
        card.innerHTML = `
          <img src="${drama.poster || FALLBACK_POSTER}" alt="${drama.judul}" loading="lazy" onerror="this.src='${FALLBACK_POSTER}'">
          <div class="card-body">
            ${drama.status ? `<span class="badge ${isVip ? 'vip' : ''}">${drama.status}</span>` : ''}
            <div class="card-title">${drama.judul}</div>
            <div class="card-meta">${drama.totalEp ? drama.totalEp + ' Ep • ' : ''}${drama.views} views</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(drama) {
      const mPoster = document.getElementById('mPoster');
      mPoster.src = drama.poster || FALLBACK_POSTER;
      mPoster.onerror = () => { mPoster.src = FALLBACK_POSTER; };

      document.getElementById('mTitle').textContent = drama.judul;
      document.getElementById('mMeta').textContent = `${drama.totalEp ? drama.totalEp + ' Ep • ' : ''}${drama.views} views ${drama.status ? '• ' + drama.status.toUpperCase() : ''}`;
      document.getElementById('mSinopsis').textContent = drama.sinopsis;
      document.getElementById('mLink').href = drama.link;
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    document.getElementById('searchInput').addEventListener('input', renderDramas);

    document.querySelectorAll('.tab').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.getAttribute('data-filter');
        renderDramas();
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    loadDramas();
  </script>
</body>
</html>
